version: "3.9"

services:
  quantpulse:
    build: .
    container_name: quantpulse-v3
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - quantpulse-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  quantpulse-data:
