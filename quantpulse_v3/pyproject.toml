[project]
name = "quantpulse-v3"
version = "3.0.0"
description = "Multi-Agent Quant Cloud Trading System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "aiofiles>=23.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]
exchange = [
    "ccxt>=4.2",
    "aiohttp>=3.9",
]
notification = [
    "python-telegram-bot>=20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]
all = [
    "quantpulse-v3[server,exchange,notification,dev]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
